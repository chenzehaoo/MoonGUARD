name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: moon check / fmt / info / test (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm
          - os: ubuntu-latest
            target: native
          - os: macos-latest
            target: wasm
          - os: macos-latest
            target: native
          - os: windows-latest
            target: wasm

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit (*nix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Update MoonBit dependencies
        shell: bash
        run: moon update

      - name: moon fmt --check
        shell: bash
        run: moon fmt --check

      - name: moon info
        shell: bash
        run: moon info --target ${{ matrix.target }}

      - name: moon check (--deny-warn)
        shell: bash
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: moon build (--deny-warn)
        shell: bash
        run: moon build --target ${{ matrix.target }} --deny-warn

      - name: moon test
        shell: bash
        run: moon test --target ${{ matrix.target }}